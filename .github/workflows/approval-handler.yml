name: 承認ハンドラー（松本氏承認後の自動デプロイ）

on:
  issue_comment:
    types: [created]

jobs:
  handle-approval:
    name: 承認コメント処理
    if: |
      contains(github.event.issue.labels.*.name, '承認待ち') &&
      github.event.comment.user.login == 'matsumoto-ayuta-hub' &&
      contains(github.event.comment.body, 'approved')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: 承認処理 — サービスをLiveに変更
        uses: actions/github-script@v7
        with:
          script: |
            const issueBody = context.payload.issue.body;
            const issueTitle = context.payload.issue.title;

            // approval-queue.jsonを更新してliveステータスに
            const { execSync } = require('child_process');

            try {
              const fs = require('fs');
              const queuePath = './approval-queue.json';
              if (fs.existsSync(queuePath)) {
                const queue = JSON.parse(fs.readFileSync(queuePath, 'utf-8'));
                const updated = queue.map(item => {
                  if (issueTitle.includes(item.persona.name)) {
                    return { ...item, persona: { ...item.persona, launchStatus: 'live' } };
                  }
                  return item;
                });
                fs.writeFileSync(queuePath, JSON.stringify(updated, null, 2));
              }
            } catch (e) {
              console.error('キュー更新エラー:', e.message);
            }

            // 承認完了コメント
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `✅ **承認を確認しました。**

            松本氏（@matsumoto-ayuta-hub）による承認を受け付けました。

            - デプロイ処理: 自動実行中
            - ステータス更新: Live
            - 予定公開時刻: ${new Date(Date.now() + 10 * 60 * 1000).toLocaleString('ja-JP')}

            ---
            *ClaudeCodeが処理しました*`,
            });

            // Issueをクローズ
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              labels: [...context.payload.issue.labels.map(l => l.name).filter(n => n !== '承認待ち'), '承認済み', 'live'],
            });

      - name: 承認ファイルをコミット
        run: |
          git config --local user.email "claude-code@careerjapan.co"
          git config --local user.name "Claude Code (Approval Handler)"
          git add approval-queue.json || true
          git diff --staged --quiet || git commit -m "feat: ニッチサービス承認・ライブ化 — ${{ github.event.issue.title }}"
          git push origin main || true
